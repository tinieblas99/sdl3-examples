name: Build SDL3 Libraries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

jobs:
  build-linux:
    name: Linux (shared + static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: bash scripts/install-deps-linux.sh

      - name: Clone sources
        run: bash scripts/setup.sh

      - name: Build
        run: bash scripts/build-linux.sh ${{ github.workspace }}/../SDL3-linux

      - name: Package
        run: tar -czf SDL3-linux.tar.gz -C ${{ github.workspace }}/../SDL3-linux .

      - uses: actions/upload-artifact@v4
        with:
          name: SDL3-linux
          path: SDL3-linux.tar.gz

  build-windows:
    name: Windows x86_64 (mingw cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          bash scripts/install-deps-linux.sh
          sudo apt-get install -y mingw-w64

      - name: Clone sources
        run: bash scripts/setup.sh

      - name: Build
        run: bash scripts/build-windows.sh ${{ github.workspace }}/../SDL3-win64

      - name: Package
        run: tar -czf SDL3-win64.tar.gz -C ${{ github.workspace }}/../SDL3-win64 .

      - uses: actions/upload-artifact@v4
        with:
          name: SDL3-win64
          path: SDL3-win64.tar.gz

  release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: SDL3 Libraries ${{ github.event.inputs.tag }}
          files: |
            SDL3-linux.tar.gz
            SDL3-win64.tar.gz
